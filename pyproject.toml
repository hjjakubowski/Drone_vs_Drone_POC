[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inz-hud"
version = "0.1.0"
description = "Desktop HUD application with real-time detection and proportional navigation."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "PySide6>=6.7",
    "opencv-python>=4.10",
    "numpy>=1.26",
    "PyYAML>=6.0",
    "onnxruntime>=1.18",
]

[project.scripts]
inz-hud = "app.hud_desktop.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "ruff>=0.5",
    "mypy>=1.10",
    "pyinstaller>=6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "inz_project*"]

[tool.ruff]
line-length = 100
target-version = "py311"
